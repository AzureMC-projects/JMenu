name: Build JMenu

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            runner: windows-latest
          - target: Android64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.target }}
      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: JMenu-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
